<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Jonah George · Editor</title>
    <style>
      /* Projects in Grid View: cards, 5 in a row, with the preview clip (see the script below). */
      @media (min-width: 1000px) {
        .grid-view:has(.jg-media) .grid-body { grid-template-columns: repeat(5, minmax(0, 1fr)) !important; }
      }
      .jg-media { position: relative; aspect-ratio: 16 / 9; overflow: hidden; background: #111; }
      .jg-media img,
      .jg-media video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .jg-media video { opacity: 0; transition: opacity 0.2s; }
      .jg-media.playing video { opacity: 1; }
      .grid-row:has(> .jg-media) .grid-cell.image { display: none !important; }

      /* File fields: show the image or clip instead of a blank file icon. */
      .preview.no-thumbnail:has(> .jg-file:not([hidden])) > .icon { display: none; }
      .jg-file { width: 100%; height: 100%; object-fit: cover; }

      /* "Publishing" badge, bottom right (see the last script). */
      .jg-publish { position: fixed; right: 16px; bottom: 16px; z-index: 10000; display: flex; align-items: center; gap: 8px;
        padding: 8px 14px; border-radius: 999px; background: #222; color: #fff; font: 13px/1.2 system-ui, sans-serif;
        box-shadow: 0 2px 12px rgb(0 0 0 / 0.3); pointer-events: none; }
      .jg-publish::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: #3ecf6e; }
      .jg-publish.busy::before { background: #f5b730; animation: jg-pulse 1s ease-in-out infinite alternate; }
      .jg-publish.slow::before { background: #f0603c; }
      @keyframes jg-pulse { to { opacity: 0.3; } }
    </style>
  </head>
  <body>
    <!-- Sveltia CMS: edits the files in src/data/ and uploads files straight to the GitHub repo. Setup: config.yml next to this file. -->
    <script src="/admin/large-files.js"></script>
    <script src="https://unpkg.com/@sveltia/cms@0.233.1/dist/sveltia-cms.js"></script>
    <script>
      // Card view for Projects: adds each project's thumbnail to its card in
      // Grid View and plays the preview clip on hover. The files come from the
      // live site (/admin/cards.json, rebuilt on every save), matched by title.
      (() => {
        let cards;
        fetch('/admin/cards.json', { cache: 'no-cache' })
          .then((r) => r.json())
          .then((list) => {
            cards = new Map(list.map((c) => [c.title, c]));
            update();
          })
          .catch(() => {});

        const update = () => {
          // Open Projects as cards the first time; after that the editor remembers the chosen view.
          const grid = document.querySelector('[role="radio"][aria-label="Grid View"]');
          if (grid && location.hash.startsWith('#/collections/projects') && !localStorage.getItem('jg-grid')) {
            localStorage.setItem('jg-grid', '1');
            if (grid.getAttribute('aria-checked') !== 'true') grid.click();
          }
          if (!cards) return;
          for (const row of document.querySelectorAll('.grid-view .grid-row[aria-label]')) {
            const card = cards.get(row.getAttribute('aria-label'));
            const old = row.querySelector(':scope > .jg-media');
            if (old?.dataset.slug === card?.slug) continue;
            old?.remove();
            if (!card) continue;
            const media = document.createElement('div');
            media.className = 'jg-media';
            media.dataset.slug = card.slug;
            const img = Object.assign(document.createElement('img'), { src: card.poster, alt: '', loading: 'lazy' });
            const video = Object.assign(document.createElement('video'), { muted: true, loop: true, playsInline: true, preload: 'none' });
            video.dataset.src = card.preview;
            media.append(img, video);
            row.prepend(media);
          }

          // File and image fields: the editor can't show files kept in project
          // folders, so load them from the live site. .mov uploads are published as .mp4.
          for (const box of document.querySelectorAll('.preview.no-thumbnail')) {
            const path = box.parentElement.querySelector('.value')?.textContent.trim() ?? '';
            const src = /^\/?(images|video)\//.test(path) ? path.replace(/^\/?/, '/').replace(/\.(mov|m4v|mkv|webm|mxf)$/i, '.mp4') : '';
            const old = box.querySelector(':scope > .jg-file');
            if ((old?.dataset.src ?? '') === src) continue;
            old?.remove();
            if (!src) continue;
            const video = /\.mp4$/i.test(src);
            const el = document.createElement(video ? 'video' : 'img');
            if (video) Object.assign(el, { muted: true, loop: true, autoplay: true, playsInline: true });
            el.className = 'jg-file';
            el.dataset.src = src;
            el.onerror = () => (el.hidden = true); // not published yet: keep the icon
            el.src = src;
            box.append(el);
          }
        };

        let queued = false;
        new MutationObserver(() => {
          if (queued) return;
          queued = true;
          requestAnimationFrame(() => {
            queued = false;
            update();
          });
        }).observe(document.body, { childList: true, characterData: true, subtree: true, attributes: true, attributeFilter: ['aria-label'] });

        // Play the clip while the pointer is over a card.
        const mediaOf = (el) => el?.closest?.('.grid-row')?.querySelector(':scope > .jg-media');
        document.addEventListener('mouseover', (e) => {
          const media = mediaOf(e.target);
          if (!media || media.classList.contains('playing')) return;
          const video = media.querySelector('video');
          if (!video.src) video.src = video.dataset.src;
          media.classList.add('playing');
          video.play().catch(() => {});
        });
        document.addEventListener('mouseout', (e) => {
          const media = mediaOf(e.target);
          if (!media || media === mediaOf(e.relatedTarget)) return;
          media.classList.remove('playing');
          media.querySelector('video').pause();
        });
      })();
    </script>
    <script>
      // Publishing badge: compares the newest commit on GitHub with the one the
      // live site was built from (/admin/version.json), so the editor shows
      // whether saved changes are on the website yet.
      (() => {
        const REPO = 'designkiller2040/designkiller2040.github.io';
        const badge = document.createElement('div');
        badge.className = 'jg-publish';
        badge.hidden = true;
        badge.setAttribute('role', 'status');
        document.body.append(badge);
        let since = 0;

        const show = (state, text) => {
          badge.className = `jg-publish ${state}`;
          badge.textContent = text;
          badge.hidden = false;
        };

        const check = async () => {
          let token;
          try {
            token = JSON.parse(localStorage.getItem('sveltia-cms.user'))?.token;
          } catch {}
          if (!token) return void (badge.hidden = true);
          try {
            const [head, live] = await Promise.all([
              fetch(`https://api.github.com/repos/${REPO}/commits/main`, {
                cache: 'no-store',
                headers: { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github.sha' },
              }).then((r) => (r.ok ? r.text() : Promise.reject())),
              fetch(`/admin/version.json?t=${Date.now()}`, { cache: 'no-store' }).then((r) => r.json()),
            ]);
            if (live.commit === head.trim()) {
              since = 0;
              show('live', 'Live: all changes are on the website');
            } else {
              since ||= Date.now();
              if (Date.now() - since > 8 * 60 * 1000) show('slow', 'Publishing is taking longer than usual…');
              else show('busy', 'Publishing changes… (about 1–2 minutes)');
            }
          } catch {}
        };

        check();
        setInterval(check, 15000);
      })();
    </script>
  </body>
</html>
