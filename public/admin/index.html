<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Jonah George · Editor</title>
    <style>
      /* Projects in Grid View: cards, 5 in a row, with the preview clip (see the script below). */
      @media (min-width: 1000px) {
        .grid-view:has(.jg-media) .grid-body { grid-template-columns: repeat(5, minmax(0, 1fr)) !important; }
      }
      .jg-media { position: relative; aspect-ratio: 16 / 9; overflow: hidden; background: #111; }
      .jg-media img,
      .jg-media video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .jg-media video { opacity: 0; transition: opacity 0.2s; }
      .jg-media.ready video,
      .jg-media.playing video { opacity: 1; }
      .grid-row:has(> .jg-media) .grid-cell.image { display: none !important; }

      /* File fields: show the image or clip instead of a blank file icon. */
      .preview.no-thumbnail:has(> .jg-file:not([hidden])) > .icon { display: none; }
      .jg-file { width: 100%; height: 100%; object-fit: cover; }

      /* Jonah George logo on the sign-in screen: logo size, and white when the editor is dark. */
      img[src='/admin/logo.svg'] { width: 174px !important; height: auto !important; }
      @media (prefers-color-scheme: dark) { img[src='/admin/logo.svg'] { filter: invert(1); } }

      /* "Publishing" badge, bottom right (see the last script). */
      .jg-publish { position: fixed; right: 16px; bottom: 16px; z-index: 10000; display: flex; align-items: center; gap: 8px;
        padding: 8px 14px; border-radius: 999px; background: #222; color: #fff; font: 13px/1.2 system-ui, sans-serif;
        box-shadow: 0 2px 12px rgb(0 0 0 / 0.3); pointer-events: none; }
      .jg-publish::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: #3ecf6e; }
      .jg-publish.busy::before { background: #f5b730; animation: jg-pulse 1s ease-in-out infinite alternate; }
      .jg-publish.slow::before { background: #f0603c; }
      @keyframes jg-pulse { to { opacity: 0.3; } }

      /* "Upload film" button under the Cloudflare field, and its window (see the last script). */
      .jg-film { display: flex; align-items: center; gap: 12px; margin-top: 8px; font: 13px/1.3 system-ui, sans-serif; }
      .jg-film button { padding: 6px 14px; border: 0; border-radius: 6px; background: #2f5cff; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
      .jg-film span { opacity: 0.7; }
      .jg-film-modal { position: fixed; inset: 0; z-index: 10001; display: grid; place-items: center; background: rgb(0 0 0 / 0.6); }
      .jg-film-modal > div { position: relative; width: min(600px, calc(100vw - 32px)); height: min(560px, calc(100vh - 32px)); border-radius: 12px; overflow: hidden; background: #111; }
      .jg-film-modal iframe { width: 100%; height: 100%; border: 0; }
      .jg-film-modal button { position: absolute; top: 10px; right: 10px; width: 30px; height: 30px; border: 0; border-radius: 50%; background: #333; color: #fff; font-size: 18px; cursor: pointer; }
    </style>
  </head>
  <body>
    <script src="/admin/loading.js" data-auto></script>
    <!-- Sveltia CMS: edits the files in src/data/ and uploads files straight to the GitHub repo. Setup: config.yml next to this file. -->
    <script>
      // Admin 2.0: the project list (/admin/projects/) and project editor (/admin/project/)
      // replace this editor's own screens for projects; this editor still handles
      // sign-in, the showreel and the Assets library. "Open in old editor/list" there
      // sets jg-classic, which keeps this tab on the old screens.
      (() => {
        const signedIn = () => {
          try {
            return !!JSON.parse(localStorage.getItem('sveltia-cms.user'))?.token;
          } catch {}
        };
        const go = () => {
          if (sessionStorage.getItem('jg-classic')) return;
          const m = location.hash.match(/^#\/collections\/projects\/(?:entries\/([^/?#]+)|new\b)/);
          if (m) return location.replace(`/admin/project/?${m[1] ? `slug=${m[1]}` : 'new=1'}`);
          if (signedIn() && /^(#\/?)?$|^#\/collections\/(projects|homepage)\/?$/.test(location.hash)) location.replace('/admin/projects/');
        };
        go();
        addEventListener('hashchange', go);
        // The editor changes the address with pushState, so check after each change too.
        for (const k of ['pushState', 'replaceState']) {
          const real = history[k].bind(history);
          history[k] = (...args) => (real(...args), go());
        }
      })();
    </script>
    <script src="/admin/large-files.js"></script>
    <script src="https://unpkg.com/@sveltia/cms@0.233.1/dist/sveltia-cms.js"></script>
    <script>
      // Card view for Projects: adds each project's thumbnail to its card in
      // Grid View and plays the preview clip on hover. The cards follow the
      // project files on GitHub, so a new clip shows as soon as it's saved:
      // published files come from the live site (/admin/cards.json), files
      // not published yet straight from GitHub. Matched by title.
      (() => {
        const REPO = 'designkiller2040/designkiller2040.github.io';
        const RAW = `https://raw.githubusercontent.com/${REPO}/main/public`;
        let cards;
        let published = new Map(); // slug -> { preview, poster } URLs on the live site
        let loading = false;
        let fromGitHub = false;
        const token = () => {
          try {
            return JSON.parse(localStorage.getItem('sveltia-cms.user'))?.token;
          } catch {}
        };

        const rooted = (p) => (p ? p.replace(/^\/?/, '/') : p);
        const bare = (url) => url?.split('?')[0];
        // URL for a file path: the live site's copy if that file is published, else GitHub's.
        const fileURL = (path, live, video) => {
          const site = video ? path.replace(/\.(mov|m4v|mkv|webm|mxf)$/i, '.mp4') : path;
          return bare(live) === site ? live : `${RAW}${path}`;
        };

        const load = async () => {
          if (loading) return;
          loading = true;
          try {
            const list = await (await fetch('/admin/cards.json', { cache: 'no-cache' })).json();
            published = new Map(list.map((c) => [c.slug, c]));
            cards ??= new Map(list.map((c) => [c.title, c]));
          } catch {}
          try {
            if (!token()) return;
            const res = await fetch('https://api.github.com/graphql', {
              method: 'POST',
              headers: { Authorization: `Bearer ${token()}`, 'Content-Type': 'application/json' },
              body: JSON.stringify({
                query: `{ repository(owner: "${REPO.split('/')[0]}", name: "${REPO.split('/')[1]}") {
                  object(expression: "main:src/data/projects") { ... on Tree { entries { name object { ... on Blob { text } } } } } } }`,
              }),
            });
            const entries = (await res.json()).data.repository.object.entries;
            cards = new Map(
              entries
                .filter((e) => e.name.endsWith('.json'))
                .map((e) => JSON.parse(e.object.text))
                .map((p) => {
                  const live = published.get(p.slug);
                  const preview = rooted(p.preview);
                  const poster = rooted(p.poster);
                  return [p.title, { slug: p.slug, preview: preview ? fileURL(preview, live?.preview, true) : live?.preview, poster: poster ? fileURL(poster, live?.poster) : live?.poster }];
                }),
            );
            fromGitHub = true;
          } catch {
          } finally {
            loading = false;
          }
          update();
        };
        load();
        // Reload after saving or switching back to the list.
        window.addEventListener('hashchange', () => /^#\/collections\/projects\/?$/.test(location.hash) && load());

        const update = () => {
          // Open Projects as cards the first time; after that the editor remembers the chosen view.
          const grid = document.querySelector('[role="radio"][aria-label="Grid View"]');
          if (grid && location.hash.startsWith('#/collections/projects') && !localStorage.getItem('jg-grid')) {
            localStorage.setItem('jg-grid', '1');
            if (grid.getAttribute('aria-checked') !== 'true') grid.click();
          }
          if (!fromGitHub && !loading && token()) load(); // just signed in
          if (!cards) return;
          for (const row of document.querySelectorAll('.grid-view .grid-row[aria-label]')) {
            const card = cards.get(row.getAttribute('aria-label'));
            const old = row.querySelector(':scope > .jg-media');
            const key = card && `${card.slug} ${card.preview} ${card.poster}`;
            if (old?.dataset.key === key) continue;
            old?.remove();
            if (!card) continue;
            const media = document.createElement('div');
            media.className = 'jg-media';
            media.dataset.key = key;
            const img = Object.assign(document.createElement('img'), { alt: '', loading: 'lazy' });
            img.onerror = () => (img.hidden = true);
            if (card.poster) img.src = card.poster;
            // The picture on the card is the clip's frame at 1 second; the thumbnail image shows until it loads.
            const video = Object.assign(document.createElement('video'), { muted: true, loop: true, playsInline: true, preload: 'metadata' });
            video.dataset.src = card.preview;
            video.addEventListener('loadedmetadata', () => video.currentTime < 0.5 && !video.closest('.playing') && (video.currentTime = Math.min(1, video.duration / 2)));
            video.addEventListener('loadeddata', () => media.classList.add('ready'));
            media.append(img, video);
            row.prepend(media);
            setSource(video);
          }

          // File and image fields: the editor can't show files kept in project
          // folders, so load them from the live site. .mov uploads are published as .mp4.
          for (const box of document.querySelectorAll('.preview.no-thumbnail')) {
            const path = box.parentElement.querySelector('.value')?.textContent.trim() ?? '';
            const src = /^\/?(images|video)\//.test(path) ? path.replace(/^\/?/, '/').replace(/\.(mov|m4v|mkv|webm|mxf)$/i, '.mp4') : '';
            const old = box.querySelector(':scope > .jg-file');
            if ((old?.dataset.src ?? '') === src) continue;
            old?.remove();
            if (!src) continue;
            const video = /\.mp4$/i.test(src);
            const el = document.createElement(video ? 'video' : 'img');
            if (video) Object.assign(el, { muted: true, loop: true, autoplay: true, playsInline: true });
            el.className = 'jg-file';
            el.dataset.src = src;
            el.onerror = () => (el.hidden = true); // not published yet: keep the icon
            el.src = src;
            box.append(el);
          }
        };

        let queued = false;
        new MutationObserver(() => {
          if (queued) return;
          queued = true;
          requestAnimationFrame(() => {
            queued = false;
            update();
          });
        }).observe(document.body, { childList: true, characterData: true, subtree: true, attributes: true, attributeFilter: ['aria-label'] });

        // GitHub serves files without a video type, so a clip that isn't
        // published yet is downloaded and played from memory.
        const setSource = async (video) => {
          if (video.dataset.loading) return;
          video.dataset.loading = '1';
          const src = video.dataset.src;
          if (!src || src === 'undefined') return;
          if (!src.startsWith(RAW)) return void (video.src = `${src}#t=1`);
          try {
            const blob = await (await fetch(src)).blob();
            const type = /\.mov$/i.test(src) ? 'video/quicktime' : 'video/mp4';
            video.src = URL.createObjectURL(new Blob([blob], { type }));
            if (video.closest('.playing')) video.play().catch(() => {});
          } catch {}
        };

        // Play the clip while the pointer is over a card.
        const mediaOf = (el) => el?.closest?.('.grid-row')?.querySelector(':scope > .jg-media');
        document.addEventListener('mouseover', (e) => {
          const media = mediaOf(e.target);
          if (!media || media.classList.contains('playing')) return;
          const video = media.querySelector('video');
          if (!video.src) setSource(video);
          media.classList.add('playing');
          video.play().catch(() => {});
        });
        document.addEventListener('mouseout', (e) => {
          const media = mediaOf(e.target);
          if (!media || media === mediaOf(e.relatedTarget)) return;
          media.classList.remove('playing');
          const video = media.querySelector('video');
          video.pause();
          if (video.duration) video.currentTime = Math.min(1, video.duration / 2);
        });
      })();
    </script>
    <script>
      // Publishing badge: compares the newest commit on GitHub with the one the
      // live site was built from (/admin/version.json), so the editor shows
      // whether saved changes are on the website yet.
      (() => {
        const REPO = 'designkiller2040/designkiller2040.github.io';
        const badge = document.createElement('div');
        badge.className = 'jg-publish';
        badge.hidden = true;
        badge.setAttribute('role', 'status');
        document.body.append(badge);
        let since = 0;

        const show = (state, text) => {
          badge.className = `jg-publish ${state}`;
          badge.textContent = text;
          badge.hidden = false;
        };

        const check = async () => {
          let token;
          try {
            token = JSON.parse(localStorage.getItem('sveltia-cms.user'))?.token;
          } catch {}
          if (!token) return void (badge.hidden = true);
          try {
            const [head, live] = await Promise.all([
              fetch(`https://api.github.com/repos/${REPO}/commits/main`, {
                cache: 'no-store',
                headers: { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github.sha' },
              }).then((r) => (r.ok ? r.text() : Promise.reject())),
              fetch(`/admin/version.json?t=${Date.now()}`, { cache: 'no-store' }).then((r) => r.json()),
            ]);
            if (live.commit === head.trim()) {
              since = 0;
              show('live', 'Live: all changes are on the website');
            } else {
              since ||= Date.now();
              if (Date.now() - since > 8 * 60 * 1000) show('slow', 'Publishing is taking longer than usual…');
              else show('busy', 'Publishing changes… (about 1–2 minutes)');
            }
          } catch {}
        };

        check();
        setInterval(check, 15000);
      })();
    </script>
    <script>
      // "Upload film" on a project: opens the upload page (/admin/upload/) in a
      // window over the editor. When Cloudflare has the film ready, its ID is
      // put into the Cloudflare field, and saving the project publishes it.
      (() => {
        let target = null; // the Cloudflare field's input that gets the ID

        const open = (input) => {
          target = input;
          const slug = document.querySelector('[data-key-path="slug"] input')?.value || location.hash.split('/').pop();
          const modal = document.createElement('div');
          modal.className = 'jg-film-modal';
          modal.innerHTML = '<div><iframe title="Upload film"></iframe><button type="button" aria-label="Close">×</button></div>';
          modal.querySelector('iframe').src = `/admin/upload/?embed=1&slug=${encodeURIComponent(slug)}`;
          modal.querySelector('button').onclick = () => {
            const busy = /Step [12] of/.test(modal.querySelector('iframe').contentDocument?.getElementById('status')?.textContent ?? '');
            if (!busy || confirm('The upload is still running. Closing stops it. Close anyway?')) modal.remove();
          };
          document.body.append(modal);
        };

        window.addEventListener('message', (e) => {
          if (e.origin !== location.origin || e.data?.type !== 'jg-film' || !/^[0-9a-f]{32}$/i.test(e.data.id)) return;
          if (target?.isConnected) {
            // Set the value the way typing would, so the editor notices the change.
            Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value').set.call(target, e.data.id);
            target.dispatchEvent(new Event('input', { bubbles: true }));
            target.dispatchEvent(new Event('change', { bubbles: true }));
            const note = target.closest('section')?.querySelector('.jg-film span');
            if (note) note.textContent = 'Film uploaded. Click Save to publish it.';
          }
          setTimeout(() => document.querySelector('.jg-film-modal')?.remove(), 2500);
        });

        const add = () => {
          for (const field of document.querySelectorAll('section[data-key-path="stream"]')) {
            if (field.querySelector('.jg-film')) continue;
            const input = field.querySelector('input');
            if (!input) continue;
            const row = document.createElement('div');
            row.className = 'jg-film';
            row.innerHTML = '<button type="button">Upload film</button><span>Videos up to 1 GB. H.264 MP4 works best (not ProRes).</span>';
            row.querySelector('button').onclick = () => open(input);
            field.querySelector('.field-wrapper')?.after(row);
          }
        };
        new MutationObserver(add).observe(document.body, { childList: true, subtree: true });
      })();
    </script>
  </body>
</html>
