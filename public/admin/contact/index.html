<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Contact · Jonah George</title>
    <!--
      Contact page editor (admin 2.0 style). Reads and writes src/data/contact.json
      with the editor's GitHub sign-in: the Instagram name, the email, and which
      12 project clips make the video wall (in order). Clips come from
      /admin/cards.json, the same list the Projects page uses. Every Save is one
      commit to main, which republishes the site.
    -->
    <style>
      :root {
        --bg: #fff;
        --fg: #111;
        --muted: #6b6b6b;
        --faint: #8a8a8a;
        --line: #e6e6e6;
        --field: #dcdcdc;
        --media: #dadada;
        --red: #b42318;
      }
      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font: 14px/1.4 -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif;
        letter-spacing: 0.01em;
      }
      a { color: inherit; }
      h1, h2, h3, p { margin: 0; }
      .lbl { display: block; font-size: 12px; color: var(--muted); margin: 0 0 6px; }
      .in { width: 100%; height: 40px; padding: 0 12px; border: 1px solid var(--field); border-radius: 8px; background: var(--bg); font: inherit; color: var(--fg); }
      .in::placeholder { color: var(--faint); }
      .in:focus { outline: 2px solid #111; outline-offset: -1px; }
      .in.bad { border-color: var(--red); }
      .at { position: relative; }
      .at::before { content: '@'; position: absolute; left: 12px; top: 0; line-height: 40px; color: var(--faint); }
      .at .in { padding-left: 28px; }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 36px;
        padding: 0 14px;
        border: 1px solid var(--field);
        border-radius: 8px;
        background: var(--bg);
        font: inherit;
        font-size: 13px;
        color: var(--fg);
        text-decoration: none;
        cursor: pointer;
        white-space: nowrap;
      }
      .btn:hover { border-color: #b5b5b5; }
      .btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
      .btn.ghost:hover { color: var(--fg); }
      .btn.dark { background: #111; border-color: #111; color: #fff; }
      .btn.dark:disabled { background: #e6e6e6; border-color: #e6e6e6; color: #8a8a8a; cursor: default; }
      svg { flex-shrink: 0; }

      header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
      .bar { max-width: 1280px; margin: 0 auto; padding: 14px 48px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
      .bar > div { display: flex; align-items: center; gap: 16px; min-width: 0; }
      .brand { font-size: 16px; font-weight: 600; white-space: nowrap; }
      .sep { width: 1px; height: 20px; background: var(--line); }
      nav { display: flex; gap: 4px; }
      nav a { height: 32px; padding: 0 12px; display: inline-flex; align-items: center; border-radius: 8px; font-size: 13px; color: var(--muted); text-decoration: none; }
      nav a:hover { color: var(--fg); }
      nav a[aria-current='page'] { background: #f0f0f0; color: var(--fg); }
      .pill { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: 12px; font-size: 12px; white-space: nowrap; }
      .pill::before { content: ''; width: 6px; height: 6px; border-radius: 3px; background: currentColor; }
      .pill.live { background: #eef6ef; color: #1f6b33; }
      .pill.busy { background: #fdf4e3; color: #8a5a00; }
      .pill.busy::before { animation: pulse 1s ease-in-out infinite alternate; }
      @keyframes pulse { to { opacity: 0.3; } }
      .actions { gap: 8px !important; }
      #saveState { font-size: 12px; color: var(--muted); margin-right: 8px; }
      #saveState.err { color: var(--red); }

      main { max-width: 1280px; margin: 0 auto; padding: 48px 48px 96px; display: flex; flex-direction: column; gap: 64px; }
      section { display: flex; flex-direction: column; gap: 20px; }
      .head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; }
      h2 { font-size: 22px; font-weight: 600; }
      h2 span { margin-left: 8px; font-size: 14px; font-weight: 400; color: var(--faint); }
      .note { font-size: 13px; color: var(--muted); }
      .two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; max-width: 760px; }

      /* Wall: 4 across, like the page */
      .wall { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px; }
      .pool { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 24px 20px; }
      .clip { position: relative; display: flex; flex-direction: column; gap: 8px; border: 0; padding: 0; background: none; font: inherit; color: inherit; text-align: left; }
      .wall .clip { cursor: grab; }
      .pool .clip { cursor: pointer; }
      .pool.full .clip { cursor: default; opacity: 0.45; }
      .media { position: relative; aspect-ratio: 16 / 9; border-radius: 10px; overflow: hidden; background: var(--media); }
      .media img, .media video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .media video { opacity: 0; transition: opacity 0.2s; }
      .clip.playing .media video { opacity: 1; }
      .num { position: absolute; top: 10px; left: 10px; z-index: 1; min-width: 22px; height: 22px; padding: 0 6px; display: inline-flex; align-items: center; justify-content: center; border-radius: 6px; background: rgb(17 17 17 / 0.72); color: #fff; font-size: 11px; }
      .x { position: absolute; top: 8px; right: 8px; z-index: 1; width: 30px; height: 30px; border: 0; border-radius: 15px; background: rgb(255 255 255 / 0.9); display: flex; align-items: center; justify-content: center; cursor: pointer; opacity: 0; transition: opacity 0.15s; }
      .clip:hover .x, .clip:focus-within .x { opacity: 1; }
      .plus { position: absolute; inset: 0; margin: auto; width: 40px; height: 40px; border-radius: 20px; background: rgb(255 255 255 / 0.9); display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.15s; z-index: 1; }
      .pool:not(.full) .clip:hover .plus { opacity: 1; }
      .name { font-size: 13px; font-weight: 500; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .warn { font-size: 11px; color: #8a5a00; margin-top: -4px; }
      .clip.dragging { opacity: 0.35; }
      .clip.over .media { outline: 2px solid #111; outline-offset: 3px; }
      .slot { aspect-ratio: 16 / 9; border: 1px dashed #cfcfcf; border-radius: 10px; background: #f8f8f8; display: flex; align-items: center; justify-content: center; text-align: center; padding: 8px; font-size: 12px; color: var(--faint); }

      .center { max-width: 480px; margin: 120px auto; padding: 0 16px; text-align: center; display: flex; flex-direction: column; gap: 16px; align-items: center; }

      @media (max-width: 700px) {
        .bar { padding: 12px 16px; }
        main { padding: 32px 16px 64px; gap: 48px; }
        .two { grid-template-columns: 1fr; }
        .wall { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
        .pool { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 12px; }
        .x { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <script src="/admin/github-proxy.js"></script>
    <script src="/admin/loading.js"></script>
    <header>
      <div class="bar">
        <div>
          <h1 class="brand">Jonah George</h1>
          <span class="sep"></span>
          <nav aria-label="Sections">
            <a href="/admin/projects/">Projects</a>
            <a href="/admin/showreel/">Home</a>
            <a href="/admin/about/">About</a>
            <a href="/admin/contact/" aria-current="page">Contact</a>
          </nav>
          <span id="live" class="pill" hidden></span>
        </div>
        <div class="actions">
          <span id="saveState" role="status"></span>
          <a class="btn" href="/contact/" target="_blank" rel="noopener">
            View page
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M8 7h9v9"/></svg>
          </a>
          <button id="save" class="btn dark" type="button" disabled>Save</button>
        </div>
      </div>
    </header>

    <div id="message" class="center" hidden></div>

    <main id="editor" hidden>
      <section>
        <div class="head">
          <h2>Contact details</h2>
          <p class="note">Shown in the middle of the video wall. Leave one empty to hide it.</p>
        </div>
        <div class="two">
          <div>
            <label class="lbl" for="instagram">Instagram</label>
            <div class="at"><input class="in" id="instagram" type="text" placeholder="jonahgeorge" autocomplete="off" spellcheck="false" /></div>
          </div>
          <div>
            <label class="lbl" for="email">Email</label>
            <input class="in" id="email" type="email" placeholder="name@example.com" autocomplete="off" spellcheck="false" />
          </div>
        </div>
      </section>

      <section>
        <div class="head">
          <h2>Video wall <span id="count"></span></h2>
          <p class="note">12 preview clips, in this order: left to right, top to bottom. Drag to reorder.</p>
        </div>
        <div class="wall" id="wall"></div>
      </section>

      <section>
        <div class="head">
          <h2>More clips</h2>
          <p class="note" id="poolNote"></p>
        </div>
        <div class="pool" id="pool"></div>
      </section>
    </main>

    <script>
      const REPO = 'designkiller2040/designkiller2040.github.io';
      const PATH = 'src/data/contact.json';
      const SIZE = 12;

      const $ = (id) => document.getElementById(id);
      let token = '';
      try {
        token = JSON.parse(localStorage.getItem('sveltia-cms.user') || '{}').token || '';
      } catch {}

      // ---------- GitHub ----------
      async function gh(p, init = {}) {
        const res = await fetch(`https://api.github.com/repos/${REPO}/${p}`, {
          cache: 'no-store',
          ...init,
          headers: { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json', ...(init.body && { 'Content-Type': 'application/json' }) },
          body: init.body && JSON.stringify(init.body),
        });
        const out = await res.json().catch(() => ({}));
        if (!res.ok) throw Object.assign(new Error(out.message || `GitHub said ${res.status}`), { status: res.status });
        return out;
      }
      const decode = (b64) => new TextDecoder().decode(Uint8Array.from(atob(b64.replace(/\n/g, '')), (c) => c.charCodeAt(0)));
      const encode = (text) => btoa(String.fromCharCode(...new TextEncoder().encode(text)));

      // ---------- Helpers ----------
      const el = (tag, props = {}, ...kids) => {
        const e = Object.assign(document.createElement(tag), props);
        for (const k of kids) if (k != null) e.append(k);
        return e;
      };
      const svg = (html, size = 14) => {
        const t = document.createElement('template');
        t.innerHTML = `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${html}</svg>`;
        return t.content.firstChild;
      };

      // ---------- Model ----------
      let original = {};
      let sha = '';
      let model; // { instagram, email, wall: [slug] }
      let savedSnapshot = '';
      let saving = false;
      let clips = new Map(); // slug -> { title, slug, preview, poster } from the live site
      const snapshot = () => JSON.stringify(model);
      const dirty = () => snapshot() !== savedSnapshot;

      // ---------- Cards ----------
      function clipCard(slug, { n, onWall }) {
        const c = clips.get(slug);
        const card = el(onWall ? 'div' : 'button', { className: 'clip', ...(onWall ? { draggable: true } : { type: 'button' }) });
        const media = el('div', { className: 'media' });
        if (c?.poster) {
          const img = el('img', { alt: '', loading: 'lazy', src: c.poster });
          img.onerror = () => img.remove();
          media.append(img);
        }
        if (c?.preview) {
          const video = el('video', { muted: true, loop: true, playsInline: true, preload: c.poster ? 'none' : 'metadata', src: c.preview });
          if (!c.poster) video.addEventListener('loadeddata', () => (video.style.opacity = 1), { once: true });
          media.append(video);
          const play = (on) => {
            card.classList.toggle('playing', on);
            on ? video.play().catch(() => {}) : video.pause();
          };
          card.addEventListener('mouseenter', () => play(true));
          card.addEventListener('mouseleave', () => play(false));
        }
        if (onWall) {
          media.append(el('span', { className: 'num', textContent: n }));
          const x = el('button', { className: 'x', type: 'button', title: 'Take off the wall', ariaLabel: 'Take off the wall' }, svg('<path d="M6 6l12 12M18 6L6 18"/>'));
          x.onclick = () => {
            model.wall.splice(model.wall.indexOf(slug), 1);
            update();
          };
          media.append(x);
          drag(card, slug);
        } else {
          media.append(el('span', { className: 'plus' }, svg('<path d="M12 5v14M5 12h14"/>', 18)));
          card.title = 'Add to the wall';
          card.onclick = () => {
            if (model.wall.length >= SIZE) return;
            model.wall.push(slug);
            update();
          };
        }
        card.append(media, el('span', { className: 'name', textContent: c?.title || slug }));
        if (onWall && !c?.preview) card.append(el('span', { className: 'warn', textContent: c ? 'No preview clip: skipped on the site' : 'Project not found: skipped on the site' }));
        return card;
      }

      // Drag clips on the wall to reorder them.
      let dragging = null;
      function drag(card, slug) {
        card.addEventListener('dragstart', (e) => {
          dragging = slug;
          e.dataTransfer.effectAllowed = 'move';
          e.dataTransfer.setData('text/plain', slug);
          requestAnimationFrame(() => card.classList.add('dragging'));
        });
        card.addEventListener('dragend', () => {
          card.classList.remove('dragging');
          dragging = null;
        });
        card.addEventListener('dragover', (e) => {
          if (!dragging || dragging === slug) return;
          e.preventDefault();
          card.classList.add('over');
        });
        card.addEventListener('dragleave', () => card.classList.remove('over'));
        card.addEventListener('drop', (e) => {
          card.classList.remove('over');
          if (!dragging || dragging === slug) return;
          e.preventDefault();
          const w = model.wall;
          const from = w.indexOf(dragging);
          w.splice(from, 1);
          w.splice(w.indexOf(slug) + (from <= w.indexOf(slug) ? 1 : 0), 0, dragging);
          update();
        });
      }

      function render() {
        const w = model.wall;
        const slots = Array.from({ length: Math.max(0, SIZE - w.length) }, () => el('div', { className: 'slot', textContent: 'Empty: filled by another clip on the site, or pick one below' }));
        $('wall').replaceChildren(...w.map((s, i) => clipCard(s, { n: i + 1, onWall: true })), ...slots);
        $('count').textContent = `${w.length} of ${SIZE}`;
        const rest = [...clips.values()].filter((c) => c.preview && !w.includes(c.slug));
        const full = w.length >= SIZE;
        $('pool').classList.toggle('full', full);
        $('pool').replaceChildren(...rest.map((c) => clipCard(c.slug, { onWall: false })));
        $('poolNote').textContent = full ? 'The wall is full. Take a clip off (×) to add another.' : 'Click a clip to add it to the wall.';
      }

      // ---------- Save ----------
      function update() {
        render();
        changed();
      }
      function changed() {
        const d = dirty();
        $('save').disabled = !d || saving;
        if (!saving) setState(d ? 'Unsaved changes' : 'All changes saved');
      }
      function setState(text, error = false) {
        $('saveState').textContent = text;
        $('saveState').classList.toggle('err', error);
      }
      for (const k of ['instagram', 'email']) {
        $(k).addEventListener('input', () => {
          model[k] = $(k).value;
          $(k).classList.remove('bad');
          changed();
        });
      }
      addEventListener('beforeunload', (e) => {
        if (dirty() || saving) e.preventDefault();
      });
      addEventListener('keydown', (e) => {
        if ((e.metaKey || e.ctrlKey) && e.key === 's') {
          e.preventDefault();
          if (!$('save').disabled) save();
        }
      });

      async function save() {
        const instagram = model.instagram.trim().replace(/^@/, '').replace(/^https?:\/\/(www\.)?instagram\.com\//i, '').replace(/\/.*$/, '');
        const email = model.email.trim().replace(/^mailto:/i, '');
        if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          $('email').classList.add('bad');
          return setState('That email address doesn’t look right.', true);
        }
        saving = true;
        $('save').disabled = true;
        try {
          setState('Saving…');
          const now = await gh(`contents/${PATH}?ref=main`);
          if (now.sha !== sha) throw new Error('The Contact page was changed somewhere else since you opened it. Copy your changes, reload the page, and redo them.');
          const data = { ...original, instagram, email, wall: [...model.wall] };
          const text = JSON.stringify(data, null, 2) + '\n';
          const out = await gh(`contents/${PATH}`, { method: 'PUT', body: { message: 'Update the Contact page', content: encode(text), sha, branch: 'main' } });
          sha = out.content.sha;
          original = data;
          model.instagram = $('instagram').value = instagram;
          model.email = $('email').value = email;
          savedSnapshot = snapshot();
          saving = false;
          changed();
          setState('Saved. The website updates in about 2 minutes.');
          checkLive();
        } catch (e) {
          saving = false;
          changed();
          setState(e.message || 'Saving failed. Check the connection and try again.', true);
        }
      }
      $('save').onclick = save;

      // ---------- Live badge ----------
      let since = 0;
      async function checkLive() {
        try {
          const [head, live] = await Promise.all([
            fetch(`https://api.github.com/repos/${REPO}/commits/main`, { cache: 'no-store', headers: { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github.sha' } }).then((r) => (r.ok ? r.text() : Promise.reject())),
            fetch(`/admin/version.json?t=${Date.now()}`, { cache: 'no-store' }).then((r) => r.json()),
          ]);
          const pill = $('live');
          pill.hidden = false;
          if (live.commit === head.trim()) {
            since = 0;
            pill.className = 'pill live';
            pill.textContent = 'Live';
            pill.title = 'All saved changes are on the website';
          } else {
            since ||= Date.now();
            pill.className = 'pill busy';
            pill.textContent = Date.now() - since > 8 * 60 * 1000 ? 'Publishing (slow)' : 'Publishing…';
            pill.title = 'Saved changes appear on the website in about 2 minutes';
          }
        } catch {}
      }

      // ---------- Start ----------
      function fail(text, link) {
        $('editor').hidden = true;
        const box = $('message');
        box.hidden = false;
        jgLoaded();
        box.replaceChildren(el('p', { textContent: text }));
        if (link) box.append(el('a', { className: 'btn', href: link[1], textContent: link[0] }));
      }

      async function start() {
        if (!token) return fail('Sign in to the editor first.', ['Go to sign in', '/admin/']);
        try {
          const [f, list] = await Promise.all([gh(`contents/${PATH}?ref=main`), fetch('/admin/cards.json', { cache: 'no-cache' }).then((r) => r.json()).catch(() => [])]);
          sha = f.sha;
          original = JSON.parse(decode(f.content));
          clips = new Map(list.map((c) => [c.slug, c]));
        } catch (e) {
          return fail(`Couldn't load the Contact page: ${e.message}`, ['Try again', location.href]);
        }
        model = { instagram: original.instagram || '', email: original.email || '', wall: [...(original.wall || [])].slice(0, SIZE) };
        $('instagram').value = model.instagram;
        $('email').value = model.email;
        savedSnapshot = snapshot();
        render();
        $('editor').hidden = false;
        jgLoaded();
        changed();
        checkLive();
        setInterval(checkLive, 15000);
      }
      start();
    </script>
  </body>
</html>
