# Builds the site and publishes it to GitHub Pages on every push to main.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The build converts .mov previews (scripts/convert-previews.sh) takes thumbnails from them (scripts/preview-frames.sh), cuts clips from Cloudflare films (scripts/stream-previews.sh), and copies a Cloudflare showreel (scripts/stream-reel.sh).
      - name: Install ffmpeg
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - uses: actions/cache@v4
        with:
          path: .cache
          key: previews-${{ hashFiles('public/video/previews/**', 'public/images/uploads/**', 'src/data/projects/**', 'src/data/home.json') }}
          restore-keys: previews-
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
