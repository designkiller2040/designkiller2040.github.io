# Builds the site and publishes it to GitHub Pages on every push to main.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # to connect newly uploaded preview clips (below)
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Clips uploaded on the editor's Assets page get connected to their projects by file name.
      - name: Connect new preview clips to their projects
        run: |
          node scripts/link-previews.mjs
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -qam 'Connect new preview clips to their projects'
            git push || echo 'Could not push the change; this build still uses the new clips.'
          fi
      # Preview clips uploaded as .mov etc. are converted during the build (scripts/convert-previews.sh).
      - name: Install ffmpeg
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - uses: actions/cache@v4
        with:
          path: .cache/previews
          key: previews-${{ hashFiles('public/video/previews/**') }}
          restore-keys: previews-
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
